# Every threshold, filter parameter and cooldown lives here, one section per
# module, each with a comment on WHY it has that value. Owners justify their
# own section in the individual questions.
#
# Override from the CLI:  --set pose.conf_threshold=0.4

source:
  # Webcam index (int) or path to a video file (str). CLI --source overrides.
  uri: 0
  # Requested capture size. 1280x720 is the common native mode of laptop
  # webcams; the driver may silently fall back to something else.
  width: 1280
  height: 720
  # Requested webcam FPS. 30 is what most UVC webcams deliver at 720p.
  fps: 30
  # Mirror once at capture so "left" is the same for players and code.
  # Clips are recorded raw (unmirrored) and mirrored on load, like the webcam.
  mirror: true
  # Video files only: "file" derives Frame.t from the video timestamp, so
  # filters see the true dt and runs are reproducible. "wall" uses the
  # processing clock, like a live webcam.
  video_time: file
  # Video files only: restart at the end instead of stopping.
  loop: false

pose:                     # Task 2 — detection
  # "yolo" = real pretrained model; "none" = no detections (for tests
  # without weights or GPU).
  backend: yolo
  # Nano model: fast enough for real time on a laptop GPU. Downloaded into
  # models/ on first run (gitignored).
  weights: models/yolo26n-pose.pt
  # "auto" = cuda:0 if available, else cpu.
  device: auto
  # Inference size (long side). 640 is the size the model was trained at.
  imgsz: 640
  # Minimum person score to keep a detection. Low-ish so a partly occluded
  # player is still reported; Task 3 decides what to trust.
  det_conf: 0.35
  # Upper bound on persons returned. The game has 2 players; a few extra
  # lets identity reject bystanders instead of the detector dropping players.
  max_det: 5
  # Half-precision inference on CUDA; ~2x faster with no visible accuracy loss.
  half: true
  # Debug overlay only: hide keypoints below this confidence. 0.5 matches
  # the threshold Ultralytics uses when drawing keypoints.
  debug_kpt_conf: 0.5

identity:                 # Task 3 — phase-1 stub: left half = P1, right half = P2
  # Frames can contain bystanders; the stub keeps only the best-scoring
  # detection per half.
  num_players: 2

motion:                   # Task 2 — motion filtering (stub: pass-through)
  # Keypoints under this confidence are marked invalid. 0.5 matches the
  # threshold Ultralytics uses when drawing keypoints.
  kpt_conf_threshold: 0.5

face:                     # Task 1 — stub: above_head anchor above the nose
  # above_head sits this many shoulder-widths above the nose. ~0.9 clears
  # the top of the head for an average adult.
  above_head_factor: 0.9
  # Fallback head scale (px) when shoulders are not visible.
  default_scale: 80.0

gestures:                 # Task 4 — stub: no events
  {}

game:                     # Task 4 — stub: prints events
  {}

recorder:
  # Write one per-frame CSV per run (frame_id, t, stage ms, per-player
  # status/pos). This is the evidence for FPS and latency in the report.
  log: true
  log_dir: logs
  # Append buffered rows to the CSV every N frames (~10 s at 30 fps): bounds
  # data loss on a crash without file I/O every frame.
  flush_every: 300
  # Codec for recorded clips. mp4v is available in every OpenCV build.
  fourcc: mp4v

render:
  window_name: IPCV game
  # Show per-stage timings and FPS in the corner of the game window.
  show_timings: true

squash:                   # Task 5 — game-play prototype (branch test-game-play), mouse-controlled
  # Avatar converted from resource/kongzoomaid-cat-seacret by
  # `blender -b -P tools/convert_avatar.py` (path relative to the repo root).
  model: resource/avatar.glb
  window_size: [1280, 720]

  # --- court, metres. Real squash court: 6.4 m wide, the T is ~5.4 m from
  # the front wall, tin 0.48 m, service line 1.78 m, out line 4.57 m. The
  # player stands at the T (y = 0).
  court_width: 6.4
  front_wall_y: 5.4
  back_wall_y: -4.3
  wall_height: 5.0
  tin_height: 0.48
  service_line: 1.78
  out_line: 4.57
  # Real ball radius is 0.02 m; 3x larger so it stays visible on screen.
  ball_radius: 0.06
  # Squash balls bounce low (~0.3-0.5 when warm). 0.55 is a bit livelier,
  # so a mouse player gets time to react after the floor bounce.
  floor_restitution: 0.55
  # Walls return more energy than the floor (ball hits them at an angle).
  wall_restitution: 0.7

  # --- serve and returns
  serve_height: 2.2        # where the ball leaves the front wall on a serve
  serve_x_range: 1.5       # serve leaves the wall within +-1.5 m of centre
  # Ball speed towards the player (m/s). 4.5 m/s over ~5 m is ~1.1 s of
  # flight: slow enough to learn with a mouse. Raise for a harder game.
  serve_speed: 4.5
  # Assist: re-aim every front-wall rebound so it reaches the player's hit
  # plane within the target box after one bounce. Off = pure physics.
  assist: true
  rebound_speed_min: 3.5   # a soft hit still comes back at a playable pace
  rebound_speed_max: 7.0   # cap: a hard hit should not become unplayable
  hit_y: 0.3               # hit plane: 0.3 m in front of the player (arm reach ~0.5 m)
  target_x_range: 1.8      # returns arrive within +-1.8 m of centre: the player has to move
  # Heights the avatar's hand can reach on the hit plane (shoulder ~1.36 m,
  # arm ~0.49 m long at avatar_scale 0.58).
  target_z_range: [1.0, 1.6]

  # --- hitting
  # Ball counts as hit when its centre comes this close to the palm during
  # a frame (swept test). Generous: hand-only, no racket.
  hit_radius: 0.3
  # Return speed = min + gain * hand speed (m/s), capped at max. The minimum
  # makes a still hand still "block" the ball back above the tin.
  hit_speed_min: 6.0
  hit_speed_gain: 1.0
  hit_speed_max: 12.0
  hit_aim_gain: 0.3        # m/s of ball per m/s of sideways / vertical hand motion
  # Upward speed on every return. At 6 m/s forward the ball needs ~0.85 s to
  # reach the wall and drops ~3.5 m in that time; 4 m/s up keeps it above the tin.
  hit_lift: 4.0

  # --- rules and pacing
  miss_y: -1.0             # ball 1 m behind the player = missed
  auto_serve_delay: 2.0    # serve by itself after 2 s (no mouse needed with pose input later)
  miss_pause: 1.5          # show the miss message this long before the next serve

  # --- avatar
  # Model is ~4.1 units tall incl. ears, shoulders at 2.34; 0.58 puts the
  # shoulders at ~1.36 m.
  avatar_scale: 0.58
  # Hand bone is not posed; the palm sits half a hand length past the wrist.
  palm_frac: 0.5
  idle_arm_dir: [0.25, 0.0, -1.0]   # non-hitting arm hangs down, slightly out
  elbow_pole: [1.0, -0.3, -1.0]     # elbow bends out, back and down, like a forehand

  # --- mouse control (control.py)
  body_x_max: 2.6          # body x range: +-(half court - 0.6 m), so the hand stays inside
  hand_reach_x: 0.6        # hand u = +-1 maps to +-0.6 m sideways from the body
  hand_z_range: [0.7, 2.0] # hand v = -1..+1 maps to these heights (IK clamps what the arm can't reach)
  body_lag: 0.25           # s; the body trails the mouse like a player running to the ball
  hand_side: 0.3           # forehand: the hand rests a bit right of the body
  hand_lead_gain: 1.5      # while the body lags, the hand leads towards the mouse
  # Time constant for smoothing hand velocity (finite differences are noisy
  # at 60 fps); short, so a swing still registers at full speed.
  hand_vel_tau: 0.04

  # --- camera, behind and above the player (TV squash view through a glass
  # back wall). Far and high enough that the avatar covers little of the
  # court; the ball is also drawn faintly through the avatar (app.py).
  camera_pos: [0.0, -7.5, 3.4]
  camera_look_at: [0.0, 2.0, 0.9]

clash:                    # Task 5 — Color Clash bolt prototype (branch test-game-play), mouse vs WASD
  # Same avatar as the squash prototype, loaded twice.
  model: resource/avatar.glb
  window_size: [1280, 720]
  avatar_scale: 0.58      # shoulders at ~1.36 m, as in squash
  palm_frac: 0.5
  # Direction of a hanging arm as (out, forward, up); also used for the
  # non-firing arm. Same value as squash.
  idle_arm_dir: [0.25, 0.0, -1.0]
  # Elbow pole for the firing arm as (out, forward, up): the elbow bends out
  # and down, so a jab looks like a punch, not a chicken wing.
  elbow_pole: [1.0, -0.2, -1.0]

  # --- field, metres. P1 on the left half (x < 0), P2 on the right.
  # 9 m long: players start ~5 m apart, so a bolt is in the air ~0.6 s,
  # long enough to see it and step aside (human reaction ~0.25 s).
  field_length: 9.0
  # 4 m deep: room to dodge several body widths in depth.
  field_depth: 4.0
  centre_gap: 0.75        # nobody stands right at the centre line (no point-blank shots)
  edge_margin: 0.4        # ~ body radius: the avatar stays fully on the field

  # --- colours (RGB 0..1), design doc 5: P1 blue, P2 red
  player_colors: [[0.15, 0.45, 1.0], [0.95, 0.2, 0.15]]
  # How strongly the avatar is tinted (0 = untinted texture, 1 = flat colour).
  # 0.6 keeps the face readable while the colour shift is obvious.
  tint_strength: 0.6

  # --- round
  countdown: 3.0          # design doc 6, stage 1: "a short countdown"

  # --- Magic Bolt (design doc 4.1: fast, small, low damage, short cooldown)
  bolt_speed: 9.0         # m/s; crosses the ~5 m gap in ~0.6 s
  bolt_radius: 0.12       # small hitbox; drawn at this size too
  bolt_damage: 0.1        # 10 hits cover a player completely
  bolt_cooldown: 0.5      # s; at most 2 bolts/s, so spamming does not beat dodging
  trail_len: 6            # positions kept for the trail (~0.1 s at 60 fps)
  jab_time: 0.18          # s the firing arm stays extended after a shot
  # Hit volume as spheres above the player's floor position: [height, radius].
  # Measured from the model joints at avatar_scale 0.58: hips 0.88 m, neck
  # 1.48 m, head + ears up to 2.39 m (big chibi head).
  body_spheres: [[1.15, 0.3], [1.85, 0.38]]

  # --- firing arm. Hand target relative to the body, as (towards opponent,
  # depth, height) in metres. Ready: hand in front of the chest; jab: further
  # than the ~0.49 m arm can reach, so IK straightens the arm.
  hand_ready: [0.25, -0.2, 1.2]
  hand_jab: [0.7, -0.2, 1.3]
  # The arm on the camera side fires (stays visible): with the facing cheat
  # below that is P1's right and P2's left arm.
  fire_arm: [R, L]

  # --- controls
  mouse_lag: 0.12         # s; P1 walks to the cursor instead of teleporting
  key_speed: 3.0          # m/s P2 walking speed: a brisk step, crosses the depth in ~1.2 s

  # --- camera: orthographic, from the front and raised, looking along +y.
  # The field runs left-right on screen like the webcam view. Each avatar is
  # turned this many degrees from the field axis towards the camera (the
  # theatre "cheat"), so both faces show in 3/4 view while they face each other.
  facing_cheat: 30
  camera_elevation: 35    # degrees above the floor: classic isometric pitch
  camera_distance: 20     # far enough to sit outside the field; ortho, so no perspective effect
  camera_look_at: [0.0, 0.0, 0.9]
  film_width: 11.0        # metres visible across the screen: field (9 m) plus margins
