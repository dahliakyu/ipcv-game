# Every threshold, filter parameter and cooldown lives here, one section per
# module, each with a comment on WHY it has that value. Owners justify their
# own section in the individual questions.
#
# Override from the CLI:  --set pose.conf_threshold=0.4

source:
  # Webcam index (int) or path to a video file (str). CLI --source overrides.
  uri: 0
  # Requested capture size. 1280x720 is the common native mode of laptop
  # webcams; the driver may silently fall back to something else.
  width: 1280
  height: 720
  # Requested webcam FPS. 30 is what most UVC webcams deliver at 720p.
  fps: 30
  # Mirror once at capture so "left" is the same for players and code.
  # Clips are recorded raw (unmirrored) and mirrored on load, like the webcam.
  mirror: true
  # Video files only: "file" derives Frame.t from the video timestamp, so
  # filters see the true dt and runs are reproducible. "wall" uses the
  # processing clock, like a live webcam.
  video_time: file
  # Video files only: restart at the end instead of stopping.
  loop: false

pose:                     # Task 2 — detection
  # "yolo" = real pretrained model; "none" = no detections (for tests
  # without weights or GPU).
  backend: yolo
  # Nano model: fast enough for real time on a laptop GPU. Downloaded into
  # models/ on first run (gitignored).
  weights: models/yolo26n-pose.pt
  # "auto" = cuda:0 if available, else cpu.
  device: auto
  # Inference size (long side). 640 is the size the model was trained at.
  imgsz: 640
  # Minimum person score to keep a detection. Low-ish so a partly occluded
  # player is still reported; Task 3 decides what to trust.
  det_conf: 0.35
  # Upper bound on persons returned. The game has 2 players; a few extra
  # lets identity reject bystanders instead of the detector dropping players.
  max_det: 5
  # Half-precision inference on CUDA; ~2x faster with no visible accuracy loss.
  half: true
  # Debug overlay only: hide keypoints below this confidence. 0.5 matches
  # the threshold Ultralytics uses when drawing keypoints.
  debug_kpt_conf: 0.5

identity:                 # Task 3 — phase-1 stub: left half = P1, right half = P2
  # Frames can contain bystanders; the stub keeps only the best-scoring
  # detection per half.
  num_players: 2

motion:                   # Task 2 — keypoint smoothing (Colour Clash KeypointTracker)
  # "ema" = the prototype's smoothing: confidence gate, hold, EMA, snap back.
  # "stub" = phase-1 pass-through (no smoothing, no hold).
  backend: ema
  # Keypoints under this confidence count as missing this frame. 0.35 is the
  # prototype's CONF_T, which the gesture thresholds were tuned with.
  kpt_conf_threshold: 0.35
  # EMA time constant (s). The prototype used alpha = 0.5 per frame at about
  # 30 FPS; tau = -dt / ln(1 - alpha) = 0.033 / 0.693 = 0.048 s. Light
  # smoothing, so a punch still reads within a frame or two.
  tau: 0.048
  # A missing keypoint keeps its last position, and stays valid, this long
  # (prototype MISSING_FRAMES = 10 at 30 FPS). Rides out one-frame dropouts
  # in fast arm moves; after that the point is invalid and snaps back to the
  # detection when it returns.
  hold_s: 0.33

face:                     # Task 1 — YuNet face detection on per-player head crops
  # "yunet" = real detector; "stub" = above_head anchor above the nose
  # keypoint (no model file needed, used by the tests).
  backend: yunet
  # YuNet face detector from the OpenCV model zoo. Not in the repo; the
  # README has the download command.
  model: models/face_detection_yunet_2023mar.onnx
  # Detection score threshold. Lower than OpenCV's 0.9 default so blurry or
  # distant faces are still found (prototype value).
  score_threshold: 0.6
  # YuNet's own non-maximum suppression: overlapping boxes above this IoU
  # count as one face (OpenCV default 0.3).
  nms_threshold: 0.3
  # Candidates kept before NMS. A head crop holds one or two faces, so 50
  # is plenty (OpenCV default 5000).
  top_k: 50
  # Ignore detections narrower than this (px): too small to place effects.
  # Prototype value at 640x480; re-check at 1280x720.
  min_face: 20
  # Reject a detection whose width differs from the player's last face width
  # by more than this fraction: a jump that large in one frame is a wrong
  # detection, not the same face (prototype MAX_SIZE_JUMP).
  max_size_jump: 0.5

  # Head crop per player, from the pose keypoints. Keypoints under this
  # confidence are not used to place it; 0.5 matches motion.kpt_conf_threshold.
  kpt_conf_threshold: 0.5
  # Crop side in shoulder widths (person-box widths when a shoulder is not
  # visible). A face is roughly 0.4 shoulder widths wide, so 1.5 leaves room
  # for keypoint error and head tilt; YuNet's cost grows with the crop area.
  crop_size: 1.5
  # Crops larger than this (px, longest side) are shrunk before YuNet runs;
  # null = never shrink. A face is ~0.27 of the crop width, so at 192 it is
  # still ~50 px for YuNet. Measured on a 4K clip (480 px crops): face stage
  # 23.4 -> 9.2 ms, detections 99.2% -> 98.9%; below 192 the gain flattens.
  crop_max_px: 192

  # One Euro filter on the 4 face key points (prototype values).
  # min_cutoff (Hz): lower = steadier hat when the head is still.
  filter_min_cutoff: 1.5
  # beta: higher = less lag when the head moves fast.
  filter_beta: 0.1
  # d_cutoff (Hz): smoothing of the speed estimate (One Euro default).
  filter_d_cutoff: 1.0
  # Forget a player's face state (filter, last width) after this long
  # without any update (detection or flow), so a returning face starts fresh
  # instead of sliding in. The effect has faded to 0 by then. Prototype
  # MAX_MISSED = 30 frames at 30 FPS.
  lost_after_s: 1.0
  # Keep the effect fully visible this long after the last update, then fade
  # it out until lost_after_s. Covers single missed frames without a visible
  # flicker. Prototype HOLD_FRAMES = 3 frames at 30 FPS.
  hold_s: 0.1

  # Optical-flow fallback when YuNet misses a face (prototype values).
  # Follow a face with flow for at most this long after its last detection;
  # longer and the points drift off the face. Prototype FLOW_FRAMES = 40
  # frames at 30 FPS.
  flow_max_s: 1.3
  # Flow points: an n x n grid on the face, in face widths from the face
  # centre (x along the eye line, y down the face). Covers eyes to mouth and
  # stays off the background at the face edges.
  flow_grid_x: [-0.35, 0.35]
  flow_grid_y: [-0.35, 0.45]
  flow_grid_n: 6
  # Lucas-Kanade window (px) and pyramid levels: a large window and 4 levels
  # follow fast head moves.
  flow_win: 31
  flow_levels: 4
  # Lucas-Kanade stopping rule per point: [max iterations, min step in px].
  flow_criteria: [20, 0.01]
  # Fit a similarity transform to the tracked points with RANSAC: need at
  # least flow_min_points tracked points and flow_min_inliers within
  # flow_ransac_px of the fit, otherwise the face is not followed this frame.
  flow_min_points: 8
  flow_min_inliers: 6
  flow_ransac_px: 3.0
  # Reject a fit that scales the face outside this range between two frames:
  # a real head does not zoom that fast, so the points have drifted.
  flow_scale_range: [0.7, 1.4]

  # Face geometry from YuNet's 5 landmarks, in face widths (YuNet box
  # width); prototype values, tuned by eye.
  # Face centre this far below the eye midpoint (cheek level).
  center_drop: 0.20
  # Forehead point this far above the eye midpoint.
  forehead_rise: 0.50
  # Upper-lip point: this fraction of the way from the mouth centre to the
  # nose, where a mustache sits.
  lip_to_nose: 0.35
  # Hat brim this far above the forehead point (the effect hangs the hat
  # from its visible brim). 0.11 keeps the prototype's look: it placed the
  # sprite's bottom 0.40 below the forehead point, and the sprite has 34%
  # transparent padding below the brim at 1.5 face widths: -0.40 + 0.51.
  hat_rise: 0.11
  # above_head anchor this far above the hat brim. The visible hat is ~0.6
  # face widths tall, so this clears it; the prototype drew the player name
  # here (1.6 above the eyes, as now).
  above_head_rise: 1.0

  # Head pose (steps 9-10): forehead, hat and above_head are 3D points on a
  # canonical head, projected into the image with the head's rotation, so
  # they follow it when it tilts up/down or turns. The rotation comes from
  # MediaPipe (below), else from solvePnP on the YuNet landmarks and the
  # ears. false = 2D anchors from the offsets above only.
  head_pose: true
  # Canonical head (mm; origin between the eyes, x image-right, y down,
  # z into the head). Eyes 63 mm apart (adult average); nose tip and mouth
  # corners match YuNet's average layout on 73 test detections (nose 0.54,
  # mouth 0.99 eye distances below the eyes, mouth 0.85 wide); depths from a
  # generic face model (nose tip 27 mm in front of the eyes).
  head_model_mm:
    left_eye: [-31.5, 0.0, 0.0]
    right_eye: [31.5, 0.0, 0.0]
    nose: [0.0, 34.0, -27.0]
    left_mouth: [-27.0, 62.0, -2.0]
    right_mouth: [27.0, 62.0, -2.0]
    # Ears for the solvePnP fallback (pose model keypoints): ~72 mm to the
    # side, at the level of the ear canal just below the eyes, ~85 mm behind
    # them. Their depth gives the fit leverage on up/down tilt, which YuNet's
    # near-frontal landmarks alone underestimate.
    left_ear: [-72.0, 20.0, 85.0]
    right_ear: [72.0, 20.0, 85.0]
  # YuNet box width in eye distances (median of the same 73 detections), to
  # turn the face-width offsets above into millimetres on the head.
  box_per_eye: 2.16
  # The hat and above_head points sit this far behind the eyes, between the
  # front of the forehead and the centre of the head, so they drop towards
  # the eyes when the chin goes up and rise when it goes down. Tune by eye.
  hat_depth_mm: 50.0
  # Uncalibrated webcam: focal length = this many image widths (1.0 = ~53 deg
  # horizontal field of view, typical for laptop webcams).
  focal_per_width: 1.0
  # Ignore a pose beyond this yaw or pitch (deg): YuNet's landmarks get
  # unreliable there, so the 2D anchors are used for that frame instead.
  pose_max_deg: 60
  # MediaPipe Face Landmarker (step 10) on a crop around the face: head
  # rotation for the 3D anchors, and blendshape scores (jawOpen, eyeBlink...)
  # in Face.blendshapes. false = pose from solvePnP only, no blendshapes.
  landmarker: true
  # Model file; not in the repo, the README has the download command.
  landmarker_model: models/face_landmarker.task
  # Detection and presence confidence (MediaPipe default 0.5).
  landmarker_min_conf: 0.5
  # Crop side in face widths: the whole face with forehead and chin, plus a
  # margin for movement since the face position was measured.
  landmarker_crop: 2.0
  # Crops are shrunk to this side (px) first; the model works at 256 px.
  landmarker_max_side: 256
  # Players measured per frame, taking turns. Each run costs ~7.5 ms on the
  # CPU, so 1 keeps two players at ~15 Hz each; a blink (100-300 ms) still
  # spans 1-4 measurements. 2 = every player every frame.
  landmarker_per_frame: 1
  # A result counts as current for this long: covers the turn-taking gap
  # (one frame at 30 FPS) with margin. Older: blendshapes are empty and the
  # pose falls back to solvePnP.
  landmarker_max_age_s: 0.25
  # One Euro filter on yaw and pitch (rad). Angles from 5 landmarks are
  # noisy, so a lower cutoff than for points; beta from the update guide.
  pose_filter_min_cutoff: 1.0
  pose_filter_beta: 0.5

  # Effect sprites: RGBA PNGs, relative to the repo root.
  hat_sprite: assets/face/hat.png
  mustache_sprite: assets/face/mustache.png
  # Hat width in face widths; tuned by eye in the prototype.
  hat_width: 1.5
  # Mustache width in face widths; tuned by eye in the prototype.
  mustache_width: 0.8

  # Stub backend only: above_head sits this many shoulder-widths above the
  # nose. ~0.9 clears the top of the head for an average adult.
  above_head_factor: 0.9
  # Stub backend only: fallback head scale (px) when shoulders are not visible.
  default_scale: 80.0

gestures:                 # Task 4 — Colour Clash rules -> events
  # All distances are in shoulder widths (sw), so the rules hold at any
  # distance from the camera. Values are the prototype's (Project/bodypose.py).
  # Hands up without a visible nose: the head is taken this far above the
  # shoulder line, roughly chin height.
  head_above_shoulders: 0.3
  # Hips not visible: hip level is taken this far below the shoulders. On
  # the generous side, so the chest zone and punch height are not cut short.
  hip_below_shoulders: 2.0
  # Arms crossed: both wrists between this far above the shoulders and the
  # hips, so crossing at the chest counts but crossing overhead does not.
  chest_above_shoulders: 0.5
  # Arms crossed: wrists closer than this, so wrists that only just pass
  # each other far apart do not count. The older single-player
  # pose_detector.py used 1.2; to check on the clips (merge step 4).
  cross_max_wrist_dist: 1.5
  # Punch: elbow angle above this (degrees) counts as a straight arm; 180 is
  # fully straight, and 150 tolerates keypoint noise at the elbow.
  punch_elbow_angle: 150.0
  # Punch: wrist at least this far to the side of its shoulder (horizontal
  # distance), so an arm pointed at the camera, held close, or hanging
  # straight down is not a punch. The prototype measured the straight-line
  # distance, which let a hanging arm through (merge step 2b).
  punch_min_reach: 1.0
  # Punch: wrist no higher than this above the shoulders (and not below the
  # hips), which excludes hands up.
  punch_above_shoulders: 1.0
  # Punch: the other arm must be bent under this angle (guard), so two
  # straight arms (e.g. a T-pose) are not a punch.
  punch_bent_angle: 120.0
  # No gesture while the shoulders are closer than this (px): the shoulder
  # width is the unit of every rule, and below 10 px a few pixels of keypoint
  # noise change it by tens of percent. Prototype value.
  min_shoulder_px: 10.0
  # Hands up and arms crossed must hold this long before their event (the
  # prototype's CONFIRM_FRAMES = 2: at 30 FPS the 2nd frame comes 0.033 s
  # after the 1st; 0.03 leaves room for timestamp jitter). Filters out
  # one-frame keypoint glitches.
  confirm_s: 0.03
  # A punch stays on this long after its last detected frame (prototype
  # PUNCH_HOLD_S). It bridges frames where the arm briefly fails the rule, so
  # one punch gives one event; punches closer together than this count as one.
  punch_hold_s: 0.5

game:                     # Task 4 — stub: prints events
  {}

recorder:
  # Write one per-frame CSV per run (frame_id, t, stage ms, per-player
  # status/pos). This is the evidence for FPS and latency in the report.
  log: true
  log_dir: logs
  # Append buffered rows to the CSV every N frames (~10 s at 30 fps): bounds
  # data loss on a crash without file I/O every frame.
  flush_every: 300
  # Codec for recorded clips. mp4v is available in every OpenCV build.
  fourcc: mp4v

render:
  window_name: IPCV game
  # Show per-stage timings and FPS in the corner of the game window.
  show_timings: true
