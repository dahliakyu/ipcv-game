# Every threshold, filter parameter and cooldown lives here, one section per
# module, each with a comment on WHY it has that value. Owners justify their
# own section in the individual questions.
#
# Override from the CLI:  --set pose.conf_threshold=0.4

source:
  # Webcam index (int) or path to a video file (str). CLI --source overrides.
  uri: 0
  # Requested capture size. 1280x720 is the common native mode of laptop
  # webcams; the driver may silently fall back to something else.
  width: 1280
  height: 720
  # Requested webcam FPS. 30 is what most UVC webcams deliver at 720p.
  fps: 30
  # Mirror once at capture so "left" is the same for players and code.
  # Clips are recorded raw (unmirrored) and mirrored on load, like the webcam.
  mirror: true
  # Video files only: "file" derives Frame.t from the video timestamp, so
  # filters see the true dt and runs are reproducible. "wall" uses the
  # processing clock, like a live webcam.
  video_time: file
  # Video files only: restart at the end instead of stopping.
  loop: false

pose:                     # Task 2 — detection
  # "yolo" = real pretrained model; "none" = no detections (for tests
  # without weights or GPU).
  backend: yolo
  # Nano model: fast enough for real time on a laptop GPU. Downloaded into
  # models/ on first run (gitignored).
  weights: models/yolo26n-pose.pt
  # "auto" = cuda:0 if available, else cpu.
  device: auto
  # Inference size (long side). 640 is the size the model was trained at.
  imgsz: 640
  # Minimum person score to keep a detection. Low-ish so a partly occluded
  # player is still reported; Task 3 decides what to trust.
  det_conf: 0.35
  # Upper bound on persons returned. The game has 2 players; a few extra
  # lets identity reject bystanders instead of the detector dropping players.
  max_det: 5
  # Half-precision inference on CUDA; ~2x faster with no visible accuracy loss.
  half: true
  # Debug overlay only: hide keypoints below this confidence. 0.5 matches
  # the threshold Ultralytics uses when drawing keypoints.
  debug_kpt_conf: 0.5

identity:                 # Task 3 — Colour Clash identity (bodypose.py PlayerIdentityTracker)
  # "reid" = tracker + OSNet re-identification (bodypose.py, main.py).
  # "zones" = phase-1 stub: P1 = best detection in the left half, P2 = best
  # in the right half; no model needed (tests).
  backend: zones
  # Players the tracker creates (bodypose.py MAX_PLAYERS = 3). The game is
  # 1v1, so a third person (a bystander) never becomes a player.
  max_players: 2
  # OSNet re-identification (Colour Clash Project/osnet_embedding.py).
  # MSMT17 "combineall" weights from Hugging Face; not in the repo, the README
  # has the download command. Same network and training data as Project/'s
  # osnet_x1_0_msmt17.pth (merge_log, Task 3 plan).
  reid_weights: models/osnet_x1_0_msmt17_combineall.pth
  # "auto" = cuda if available, else cpu. ~10 ms per crop on the GPU.
  reid_device: auto
  # A new track becomes a known player when its cosine similarity to that
  # player's stored vector is at least this (bodypose.py REID_THRESHOLD).
  reid_threshold: 0.6
  # A track that matches no player becomes a new player after being seen
  # this long (bodypose.py NEW_PLAYER_CONFIRMATION = 5 frames: the 5th comes
  # 4 frames = 0.13 s after the 1st at 30 FPS). Filters out one-off
  # detections of furniture or reflections.
  new_player_s: 0.13
  # OSNet runs only on person crops at least this tall and wide (px)
  # (bodypose.py MIN_PERSON_HEIGHT / MIN_PERSON_WIDTH). Smaller crops carry
  # too little detail for its 256 x 128 input.
  min_crop_h: 40
  min_crop_w: 20
  # A track that matched no player while every player slot is taken (a
  # bystander, or a player OSNet does not recognise yet) tries again after
  # this long. bodypose.py tried every frame: ~10 ms of OSNet each time.
  retry_s: 0.5
  # Stored vector update (new; merge_log, Task 3 plan). One active player per
  # frame, in turn, at most this often. Every 0.5 s keeps OSNet at about one
  # crop per 15 frames per player.
  update_every_s: 0.5
  # The stored vector moves this fraction of the way towards the fresh one:
  # with an update every 0.5 s it follows a change (lighting, a jacket off)
  # over ~5 s, while a single odd crop moves it only a little.
  update_weight: 0.1
  # Only update when the fresh vector is at least this similar to the stored
  # one, so a crop of the wrong person (a swapped track) is not blended in.
  update_min_sim: 0.5
  # Only update when the player's box overlaps no other detection (IoU above
  # this): the other person would be in the crop.
  update_max_iou: 0.0

motion:                   # Task 2 — keypoint smoothing (Colour Clash KeypointTracker)
  # "ema" = the smoothing from bodypose.py: confidence gate, hold, EMA, snap back.
  # "stub" = phase-1 pass-through (no smoothing, no hold).
  backend: ema
  # Keypoints under this confidence count as missing this frame. 0.35 is
  # CONF_T in bodypose.py, which the gesture thresholds were tuned with.
  kpt_conf_threshold: 0.35
  # EMA time constant (s). bodypose.py used alpha = 0.5 per frame at about
  # 30 FPS; tau = -dt / ln(1 - alpha) = 0.033 / 0.693 = 0.048 s. Light
  # smoothing, so a punch still reads within a frame or two.
  tau: 0.048
  # A missing keypoint keeps its last position, and stays valid, this long
  # (bodypose.py: MISSING_FRAMES = 10 at 30 FPS). Rides out one-frame dropouts
  # in fast arm moves; after that the point is invalid and snaps back to the
  # detection when it returns.
  hold_s: 0.33

face:                     # Task 1 — YuNet face detection on per-player head crops
  # "yunet" = real detector; "stub" = above_head anchor above the nose
  # keypoint (no model file needed, used by the tests).
  backend: yunet
  # YuNet face detector from the OpenCV model zoo. Not in the repo; the
  # README has the download command.
  model: models/face_detection_yunet_2023mar.onnx
  # Detection score threshold. Lower than OpenCV's 0.9 default so blurry or
  # distant faces are still found (Task 1 script value).
  score_threshold: 0.6
  # YuNet's own non-maximum suppression: overlapping boxes above this IoU
  # count as one face (OpenCV default 0.3).
  nms_threshold: 0.3
  # Candidates kept before NMS. A head crop holds one or two faces, so 50
  # is plenty (OpenCV default 5000).
  top_k: 50
  # Ignore detections narrower than this (px): too small to place effects.
  # Task 1 script value at 640x480; re-check at 1280x720.
  min_face: 20
  # Reject a detection whose width differs from the player's last face width
  # by more than this fraction: a jump that large in one frame is a wrong
  # detection, not the same face (Task 1 script: MAX_SIZE_JUMP).
  max_size_jump: 0.5

  # Head crop per player, from the pose keypoints. Keypoints under this
  # confidence are not used to place it; 0.5 matches motion.kpt_conf_threshold.
  kpt_conf_threshold: 0.5
  # Crop side in shoulder widths (person-box widths when a shoulder is not
  # visible). A face is roughly 0.4 shoulder widths wide, so 1.5 leaves room
  # for keypoint error and head tilt; YuNet's cost grows with the crop area.
  crop_size: 1.5
  # Crops larger than this (px, longest side) are shrunk before YuNet runs;
  # null = never shrink. A face is ~0.27 of the crop width, so at 192 it is
  # still ~50 px for YuNet. Measured on a 4K clip (480 px crops): face stage
  # 23.4 -> 9.2 ms, detections 99.2% -> 98.9%; below 192 the gain flattens.
  crop_max_px: 192

  # One Euro filter on the 4 face key points (Task 1 script values).
  # min_cutoff (Hz): lower = steadier hat when the head is still.
  filter_min_cutoff: 1.5
  # beta: higher = less lag when the head moves fast.
  filter_beta: 0.1
  # d_cutoff (Hz): smoothing of the speed estimate (One Euro default).
  filter_d_cutoff: 1.0
  # Forget a player's face state (filter, last width) after this long
  # without any update (detection or flow), so a returning face starts fresh
  # instead of sliding in. The effect has faded to 0 by then. Task 1
  # script: MAX_MISSED = 30 frames at 30 FPS.
  lost_after_s: 1.0
  # Keep the effect fully visible this long after the last update, then fade
  # it out until lost_after_s. Covers single missed frames without a visible
  # flicker. Task 1 script: HOLD_FRAMES = 3 frames at 30 FPS.
  hold_s: 0.1

  # Optical-flow fallback when YuNet misses a face (Task 1 script values).
  # Follow a face with flow for at most this long after its last detection;
  # longer and the points drift off the face. Task 1 script: FLOW_FRAMES = 40
  # frames at 30 FPS.
  flow_max_s: 1.3
  # Flow points: an n x n grid on the face, in face widths from the face
  # centre (x along the eye line, y down the face). Covers eyes to mouth and
  # stays off the background at the face edges.
  flow_grid_x: [-0.35, 0.35]
  flow_grid_y: [-0.35, 0.45]
  flow_grid_n: 6
  # Lucas-Kanade window (px) and pyramid levels: a large window and 4 levels
  # follow fast head moves.
  flow_win: 31
  flow_levels: 4
  # Lucas-Kanade stopping rule per point: [max iterations, min step in px].
  flow_criteria: [20, 0.01]
  # Fit a similarity transform to the tracked points with RANSAC: need at
  # least flow_min_points tracked points and flow_min_inliers within
  # flow_ransac_px of the fit, otherwise the face is not followed this frame.
  flow_min_points: 8
  flow_min_inliers: 6
  flow_ransac_px: 3.0
  # Reject a fit that scales the face outside this range between two frames:
  # a real head does not zoom that fast, so the points have drifted.
  flow_scale_range: [0.7, 1.4]

  # Face geometry from YuNet's 5 landmarks, in face widths (YuNet box
  # width); Task 1 script values, tuned by eye.
  # Face centre this far below the eye midpoint (cheek level).
  center_drop: 0.20
  # Forehead point this far above the eye midpoint.
  forehead_rise: 0.50
  # Upper-lip point: this fraction of the way from the mouth centre to the
  # nose, where a mustache sits.
  lip_to_nose: 0.35
  # Hat brim this far above the forehead point (the effect hangs the hat
  # from its visible brim). 0.11 keeps the Task 1 script's look: it placed the
  # sprite's bottom 0.40 below the forehead point, and the sprite has 34%
  # transparent padding below the brim at 1.5 face widths: -0.40 + 0.51.
  hat_rise: 0.11
  # above_head anchor this far above the hat brim. The visible hat is ~0.6
  # face widths tall, so this clears it; the Task 1 script drew the player name
  # here (1.6 above the eyes, as now).
  above_head_rise: 1.0

  # Head pose: forehead, hat and above_head are 3D points on a
  # canonical head, projected into the image with the head's rotation, so
  # they follow it when it tilts up/down or turns. The rotation comes from
  # MediaPipe (below), else from solvePnP on the YuNet landmarks and the
  # ears. false = 2D anchors from the offsets above only.
  head_pose: true
  # Canonical head (mm; origin between the eyes, x image-right, y down,
  # z into the head). Eyes 63 mm apart (adult average); nose tip and mouth
  # corners match YuNet's average layout on 73 test detections (nose 0.54,
  # mouth 0.99 eye distances below the eyes, mouth 0.85 wide); depths from a
  # generic face model (nose tip 27 mm in front of the eyes).
  head_model_mm:
    left_eye: [-31.5, 0.0, 0.0]
    right_eye: [31.5, 0.0, 0.0]
    nose: [0.0, 34.0, -27.0]
    left_mouth: [-27.0, 62.0, -2.0]
    right_mouth: [27.0, 62.0, -2.0]
    # Ears for the solvePnP fallback (pose model keypoints): ~72 mm to the
    # side, at the level of the ear canal just below the eyes, ~85 mm behind
    # them. Their depth gives the fit leverage on up/down tilt, which YuNet's
    # near-frontal landmarks alone underestimate.
    left_ear: [-72.0, 20.0, 85.0]
    right_ear: [72.0, 20.0, 85.0]
  # YuNet box width in eye distances (median of the same 73 detections), to
  # turn the face-width offsets above into millimetres on the head.
  box_per_eye: 2.16
  # The hat and above_head points sit this far behind the eyes, between the
  # front of the forehead and the centre of the head, so they drop towards
  # the eyes when the chin goes up and rise when it goes down. Tune by eye.
  hat_depth_mm: 50.0
  # Uncalibrated webcam: focal length = this many image widths (1.0 = ~53 deg
  # horizontal field of view, typical for laptop webcams).
  focal_per_width: 1.0
  # Ignore a pose beyond this yaw or pitch (deg): YuNet's landmarks get
  # unreliable there, so the 2D anchors are used for that frame instead.
  pose_max_deg: 60
  # MediaPipe Face Landmarker on a crop around the face: head
  # rotation for the 3D anchors, and blendshape scores (jawOpen, eyeBlink...)
  # in Face.blendshapes. false = pose from solvePnP only, no blendshapes.
  landmarker: true
  # Model file; not in the repo, the README has the download command.
  landmarker_model: models/face_landmarker.task
  # Detection and presence confidence (MediaPipe default 0.5).
  landmarker_min_conf: 0.5
  # Crop side in face widths: the whole face with forehead and chin, plus a
  # margin for movement since the face position was measured.
  landmarker_crop: 2.0
  # Crops are shrunk to this side (px) first; the model works at 256 px.
  landmarker_max_side: 256
  # Players measured per frame, taking turns. Each run costs ~7.5 ms on the
  # CPU, so 1 keeps two players at ~15 Hz each; a blink (100-300 ms) still
  # spans 1-4 measurements. 2 = every player every frame.
  landmarker_per_frame: 1
  # A result counts as current for this long: covers the turn-taking gap
  # (one frame at 30 FPS) with margin. Older: blendshapes are empty and the
  # pose falls back to solvePnP.
  landmarker_max_age_s: 0.25
  # One Euro filter on yaw and pitch (rad). Angles from 5 landmarks are
  # noisy, so a lower cutoff than for points; beta from the update guide.
  pose_filter_min_cutoff: 1.0
  pose_filter_beta: 0.5

  # Effect sprites: RGBA PNGs, relative to the repo root.
  hat_sprite: assets/face/hat.png
  mustache_sprite: assets/face/mustache.png
  # Hat width in face widths; tuned by eye in the Task 1 script.
  hat_width: 1.5
  # Mustache width in face widths; tuned by eye in the Task 1 script.
  mustache_width: 0.8

  # Stub backend only: above_head sits this many shoulder-widths above the
  # nose. ~0.9 clears the top of the head for an average adult.
  above_head_factor: 0.9
  # Stub backend only: fallback head scale (px) when shoulders are not visible.
  default_scale: 80.0

gestures:                 # Task 4 — Colour Clash rules -> events
  # All distances are in shoulder widths (sw), so the rules hold at any
  # distance from the camera. Values are from bodypose.py.
  # Hands up without a visible nose: the head is taken this far above the
  # shoulder line, roughly chin height.
  head_above_shoulders: 0.3
  # Hips not visible: hip level is taken this far below the shoulders. On
  # the generous side, so the chest zone and punch height are not cut short.
  hip_below_shoulders: 2.0
  # Arms crossed: both wrists between this far above the shoulders and the
  # hips, so crossing at the chest counts but crossing overhead does not.
  chest_above_shoulders: 0.5
  # Arms crossed: wrists closer than this, so wrists that only just pass
  # each other far apart do not count. The older single-player
  # pose_detector.py used 1.2; to check on the clips (merge step 4).
  cross_max_wrist_dist: 1.5
  # Punch: elbow angle above this (degrees) counts as a straight arm; 180 is
  # fully straight, and 150 tolerates keypoint noise at the elbow.
  punch_elbow_angle: 150.0
  # Punch: wrist at least this far to the side of its shoulder (horizontal
  # distance), so an arm pointed at the camera, held close, or hanging
  # straight down is not a punch. bodypose.py measured the straight-line
  # distance, which let a hanging arm through (merge step 2b).
  punch_min_reach: 1.0
  # Punch: wrist no higher than this above the shoulders, which excludes
  # hands up.
  punch_above_shoulders: 1.0
  # Punch: wrist no lower than this below its own shoulder, so a straight arm
  # held low is not a punch (bodypose.py allowed down to the hips; merge_log,
  # Task 4 modifications). A level arm puts the wrist at shoulder height, give or take
  # keypoint noise; 0.2 sw keeps those punches. 0 = strictly level or higher.
  punch_below_shoulder: 0.2
  # Punch: the other arm must be bent under this angle (guard), so two
  # straight arms (e.g. a T-pose) are not a punch.
  punch_bent_angle: 120.0
  # No gesture while the shoulders are closer than this (px): the shoulder
  # width is the unit of every rule, and below 10 px a few pixels of keypoint
  # noise change it by tens of percent. Value from bodypose.py.
  min_shoulder_px: 10.0
  # Hands up and arms crossed must hold this long before their event
  # (bodypose.py: CONFIRM_FRAMES = 2; at 30 FPS the 2nd frame comes 0.033 s
  # after the 1st; 0.03 leaves room for timestamp jitter). Filters out
  # one-frame keypoint glitches.
  confirm_s: 0.03
  # A punch stays on this long after its last detected frame (bodypose.py:
  # PUNCH_HOLD_S). It bridges frames where the arm briefly fails the rule, so
  # one punch gives one event; punches closer together than this count as one.
  punch_hold_s: 0.5
  # Hands up and arms crossed stay on until their rule has failed for this
  # long. Without it, a keypoint dropout of a frame or two, or wrists briefly
  # above the frame (after motion.hold_s), ended the gesture and the next
  # frames started it again: a second beam from one raise (Task 4
  # modifications). 0.3 s is ~9 frames at 30 FPS; lowering and raising the
  # arms on purpose takes longer.
  release_s: 0.3

game:                     # Task 4 — Colour Clash game logic (game.py)
  # Positions are pixels. Speeds and sizes are fractions of the frame width
  # (_w) or height (_h), so the game plays the same at any resolution.
  # Starting health. A bolt takes 10 and a beam 12: 10 bolts or 9 beams win.
  max_health: 100
  # Bolt, fired by a punch. game.py: ATTACK_COOLDOWN was 1.8 s; 0 makes every
  # punch event fire a bolt (merge decision). The gesture stage already sends
  # at most one punch event every 0.5 s (gestures.punch_hold_s).
  bolt_cooldown_s: 0.0
  # Crosses the frame in 1 s. game.py's PROJECTILE_SPEED was 1.4 (0.7 s);
  # slowed down so the bolt is easier to see coming and shield.
  bolt_speed_w: 1.0
  # game.py PROJECTILE_DAMAGE.
  bolt_damage: 10
  # Beam, fired by hands up. It first charges in place (a visible warning),
  # then grows across the frame. game.py BEAM_CHARGE_DURATION, BEAM_SPEED,
  # BEAM_DURATION and BEAM_DAMAGE: stronger than a bolt, but slower to start.
  beam_charge_s: 0.35
  beam_speed_w: 2.4
  beam_duration_s: 0.8
  beam_damage: 12
  # The beam hits a body box that comes within this distance of its line
  # (game.py BEAM_HIT_RADIUS_Y): a thin line still hits a box it touches.
  beam_hit_radius_h: 0.03
  # Shield, raised by crossing the arms: blocks hits for this long (game.py
  # SHIELD_DURATION), then fades out without blocking (SHIELD_FADE_DURATION).
  shield_s: 1.0
  shield_fade_s: 0.24
  # Paint splats per hit: one at the impact point plus this many nearby,
  # spread up to this fraction of the body box, and kept within this middle
  # band of the box (fractions of its width and height) so they land on the
  # torso, not on the background in the box corners. Values from game.py.
  splat_extra: 3
  splat_spread: 0.08
  splat_band: [0.38, 0.62]
  # Longest time step the game advances in one frame (main.py: dt capped
  # at 0.1 s). After a stall or a pause, objects do not jump far ahead.
  max_dt_s: 0.1
  # Player position for bolts and the shield: shoulder midpoint and hip level
  # (center_x, torso_y in bodypose.py). Same values as the gestures: section (each
  # module reads only its own section): no position below 10 px shoulder
  # width, and hips not visible = 2 shoulder widths below the shoulders.
  min_shoulder_px: 10.0
  hip_below_shoulders: 2.0
  # Debug view only (--until game): health bar length, so it depends on the
  # player's distance to the camera but not on their arms. 2.5 face widths
  # (Face.scale) is a little wider than the shoulders. Without a face, 1.3
  # shoulder widths gives the same length: on the test clips the shoulder
  # keypoints are 1.8-2.0 face widths apart (median).
  debug_bar_face_widths: 2.5
  debug_bar_shoulder_widths: 1.3
  # Bolt look (normal attack), from the assets/beam frames: a fire blast.
  # Split by phase: the first bolt_sprite_launch frames are the launch flash,
  # the next bolt_sprite_flight frames loop while the bolt flies, and the rest
  # (its break-up into sparks) play once over bolt_end_s where the bolt ends:
  # a hit, a shield or the frame edge. null = a plain dot.
  bolt_sprite: assets/beam
  bolt_sprite_launch: 1
  bolt_sprite_flight: 2
  # 12 FPS: a common pixel-art rate; the two flight frames flicker like fire.
  bolt_sprite_fps: 12
  # The 3 break-up frames over 0.25 s, about the same rate.
  bolt_end_s: 0.25
  # Frame height as a fraction of the frame height: at 0.08 (58 px at 720p)
  # the blast is ~27 px thick and ~240 px long. Its head is on the bolt's
  # hit point and the flames trail behind it.
  bolt_sprite_h: 0.08
  # The frames' own colours (orange fire) suit P1, the red team. Other
  # players get a copy with every hue turned so it takes their team colour.
  bolt_effect_owner: 1
  # Beam look (power attack), from the magic_effect pack: a magic ball between
  # the player's hands (the beam's start point) and the beam coming out of
  # it, as in the pack's preview (magic.gif). null = a plain line.
  # beam_ball: the ball's frames, played once over the beam's whole life
  # (charge + firing): it grows while charging, swirls while the beam fires
  # and shrinks to a dot as it ends.
  beam_ball: assets/magic_effect/M5025-*.png
  # beam_band: the beam's cross-section, thickest first. The beam starts at
  # the thinnest band, thickens one step every beam_ramp_s and thins again
  # at the end; 0.1 s is the preview's frame time (10 FPS). The full band is
  # as thick as the hit band (2 x beam_hit_radius_h).
  beam_band: assets/magic_effect/L5020-*.png
  beam_ramp_s: 0.1
  # Ball frame height as a fraction of the frame height. The ball fills
  # about half its frame, so 0.36 gives a ~130 px ball at 720p: three times
  # the beam's thickness, as in the preview.
  beam_ball_h: 0.36
  # The pack's own colours (red) are this player's (P1, the red team). Other
  # players get a copy with every hue turned by the same angle, so it takes
  # their team colour (scene/draw.py).
  beam_effect_owner: 1
  # Shield look, from the assets/shield/FX019 frames: a ring of fire around
  # the player's chest. The pack's first shield_form_frames frames form the
  # ring (whirling arcs closing); they play once over shield_form_s, faster
  # than the pack's 1.3 s, because the shield blocks from its first frame and
  # lasts only shield_s. The next shield_loop_frames frames are the burning
  # ring, looped at shield_sprite_fps (the pack's preview rate); the pack's
  # remaining frames repeat them and are not used. The ring fades out with the
  # shield (shield_fade_s). null = a plain ellipse.
  shield_sprite: assets/shield/FX019
  shield_form_frames: 13
  shield_loop_frames: 16
  shield_form_s: 0.3
  shield_sprite_fps: 10
  # Ring diameter in shoulder widths: 2.6 frames the upper body (shoulders
  # plus arms crossed in front) at any distance from the camera.
  shield_ring_sw: 2.6
  # The ring's own colours (orange fire) are P1's (red team); others get a
  # hue-turned copy in their team colour.
  shield_effect_owner: 1

recorder:
  # Write one per-frame CSV per run (frame_id, t, stage ms, per-player
  # status/pos). This is the evidence for FPS and latency in the report.
  log: true
  log_dir: logs
  # Append buffered rows to the CSV every N frames (~10 s at 30 fps): bounds
  # data loss on a crash without file I/O every frame.
  flush_every: 300
  # Codec for recorded clips. mp4v is available in every OpenCV build.
  fourcc: mp4v

render:
  window_name: IPCV game
  # Show per-stage timings and FPS in the corner of the game window.
  show_timings: true
  # Debug views (--until face, gestures, game): draw the face effects (hat,
  # mustache) under the module's overlay, so the game debug view shows the
  # effects and the game together until the renderer draws the game. Views
  # before the face stage have no faces, so nothing changes there.
  debug_face_effects: true
